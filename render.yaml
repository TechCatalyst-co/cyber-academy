# Render Blueprint: the Node server (API + web client). Secrets marked sync: false are entered in the dashboard.
services:
  - type: web
    name: cyber-academy
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cyber_academy
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: BRAND_NAME
        value: Cyber Academy
      - key: HSTS
        value: "1"
