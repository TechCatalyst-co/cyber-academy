# Netlify serves the static web client and proxies the API to the Render service.
# Replace cyber-academy.onrender.com with your Render service's URL.
[build]
  publish = "client"
  command = ""

[[redirects]]
  from = "/api/*"
  to = "https://cyber-academy.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Same security headers the Node server sends.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
